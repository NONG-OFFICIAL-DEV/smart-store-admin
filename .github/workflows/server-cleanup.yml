name: Server Cleanup

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check disk and prune Docker
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== Disk usage ==="
            df -h /

            echo "=== Docker disk usage ==="
            docker system df

            echo "=== Pruning unused images, containers, networks ==="
            docker system prune -af --volumes=false

            echo "=== Disk after cleanup ==="
            df -h /
