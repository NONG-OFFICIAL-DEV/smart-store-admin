name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      webserver: ${{ steps.filter.outputs.webserver }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - backend/**
            frontend:
              - frontend/**
            webserver:
              - backend/nginx/**
              - docker-compose.yml

  build-push:
    runs-on: ubuntu-latest
    needs: changes
    env:
      IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/smart-store-backend
      IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/smart-store-frontend
      IMAGE_WEBSERVER: ${{ secrets.DOCKERHUB_USERNAME }}/smart-store-webserver
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        if: needs.changes.outputs.backend == 'true'
        run: |
          docker build -t $IMAGE_BACKEND:latest -t $IMAGE_BACKEND:$IMAGE_TAG ./backend
          docker push $IMAGE_BACKEND:latest
          docker push $IMAGE_BACKEND:$IMAGE_TAG

      - name: Build & push frontend
        if: needs.changes.outputs.frontend == 'true'
        run: |
          docker build \
            --build-arg GITHUB_TOKEN=${{ secrets.NPM_TOKEN }} \
            --build-arg VITE_APP_MODE=Production \
            --build-arg VITE_APP_API_BASE_URL=${{ secrets.API_URL_FR_SM }} \
            --build-arg VITE_APP_I18N_LOCALE=km \
            --build-arg VITE_APP_I18N_FALLBACK_LOCALE=en \
            --build-arg VITE_REVERB_APP_KEY=${{ secrets.REVERB_APP_KEY }} \
            --build-arg VITE_REVERB_HOST=${{ secrets.REVERB_HOST }} \
            --build-arg VITE_REVERB_PORT=${{ secrets.REVERB_PORT }} \
            --build-arg VITE_REVERB_SCHEME=${{ secrets.REVERB_SCHEME }} \
            -t $IMAGE_FRONTEND:latest \
            -t $IMAGE_FRONTEND:$IMAGE_TAG \
            ./frontend
          docker push $IMAGE_FRONTEND:latest
          docker push $IMAGE_FRONTEND:$IMAGE_TAG

      - name: Build & push webserver
        if: needs.changes.outputs.webserver == 'true'
        run: |
          docker build -t $IMAGE_WEBSERVER:latest -t $IMAGE_WEBSERVER:$IMAGE_TAG ./backend/nginx
          docker push $IMAGE_WEBSERVER:latest
          docker push $IMAGE_WEBSERVER:$IMAGE_TAG

  deploy:
    runs-on: ubuntu-latest
    needs: [changes, build-push]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          WEBSERVER_CHANGED: ${{ needs.changes.outputs.webserver }}
        run: |
          echo "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@$SERVER_HOST"

          # Copy docker-compose.yml by piping stdin — no tar/drone-scp involved
          $SSH "mkdir -p ~/smart-store && cat > ~/smart-store/docker-compose.yml" < docker-compose.yml

          # Write deploy script with runner values substituted in
          cat > /tmp/deploy.sh << EOF
          #!/bin/bash
          set -e
          cd ~/smart-store

          echo ">>> Pulling images"
          if [ "$BACKEND_CHANGED" = "true" ]; then
            docker pull $DOCKERHUB_USERNAME/smart-store-backend:latest
          fi
          if [ "$FRONTEND_CHANGED" = "true" ]; then
            docker pull $DOCKERHUB_USERNAME/smart-store-frontend:latest
          fi
          if [ "$WEBSERVER_CHANGED" = "true" ]; then
            docker pull $DOCKERHUB_USERNAME/smart-store-webserver:latest
          fi

          echo ">>> Restarting containers"
          docker compose down --remove-orphans || true
          docker rm -f smart_store_backend smart_store_webserver smart_store_frontend 2>/dev/null || true
          docker compose up -d --remove-orphans

          if ! docker compose ps backend_service | grep -q "Up"; then
            echo "!!! backend_service failed to start"
            docker compose logs backend_service --tail=50
            exit 1
          fi

          echo ">>> Running migrations"
          docker compose exec -T backend_service php artisan migrate --force

          echo ">>> Rebuilding cache"
          docker compose exec -T backend_service php artisan optimize:clear
          docker compose exec -T backend_service php artisan optimize
          docker compose exec -T backend_service supervisorctl restart php-fpm
          sleep 10

          echo ">>> Health check"
          CODE="000"
          for i in \$(seq 1 20); do
            CODE=\$(curl -s -o /dev/null -w "%{http_code}" http://localhost:84/api/me || echo "000")
            [ "\$CODE" = "401" ] || [ "\$CODE" = "200" ] && break
            sleep 3
          done
          if [ "\$CODE" != "401" ] && [ "\$CODE" != "200" ]; then
            echo "!!! Health check failed (got \$CODE)"
            docker compose exec -T backend_service php artisan route:list --path=api/me 2>&1 || true
            docker compose logs backend_service --tail=50
            exit 1
          fi

          echo ">>> Cleaning up"
          docker image prune -f
          echo ">>> Deploy complete"
          EOF

          $SSH bash -s < /tmp/deploy.sh
          rm -f /tmp/deploy_key /tmp/deploy.sh
