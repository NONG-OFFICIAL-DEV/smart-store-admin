name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Detect which service(s) actually changed so build-push can skip
  # rebuilding/pushing images that didn't — cheaper CI runs, and it means
  # a Docker Hub `:latest` tag genuinely only moves when its own service
  # changed, not on every unrelated push.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      webserver: ${{ steps.filter.outputs.webserver }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - backend/**
            frontend:
              - frontend/**
            webserver:
              - backend/nginx/**
              - docker-compose.yml

  build-push:
    runs-on: ubuntu-latest
    needs: changes
    env:
      IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/smart-store-backend
      IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/smart-store-frontend
      IMAGE_WEBSERVER: ${{ secrets.DOCKERHUB_USERNAME }}/smart-store-webserver
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        if: needs.changes.outputs.backend == 'true'
        run: |
          docker build -t $IMAGE_BACKEND:latest -t $IMAGE_BACKEND:$IMAGE_TAG ./backend
          docker push $IMAGE_BACKEND:latest
          docker push $IMAGE_BACKEND:$IMAGE_TAG

      - name: Build & push frontend
        if: needs.changes.outputs.frontend == 'true'
        run: |
          docker build \
            --build-arg GITHUB_TOKEN=${{ secrets.NPM_TOKEN }} \
            --build-arg VITE_APP_MODE=Production \
            --build-arg VITE_APP_API_BASE_URL=${{ secrets.API_URL_FR_SM }} \
            --build-arg VITE_APP_I18N_LOCALE=km \
            --build-arg VITE_APP_I18N_FALLBACK_LOCALE=en \
            --build-arg VITE_REVERB_APP_KEY=${{ secrets.REVERB_APP_KEY }} \
            --build-arg VITE_REVERB_HOST=${{ secrets.REVERB_HOST }} \
            --build-arg VITE_REVERB_PORT=${{ secrets.REVERB_PORT }} \
            --build-arg VITE_REVERB_SCHEME=${{ secrets.REVERB_SCHEME }} \
            -t $IMAGE_FRONTEND:latest \
            -t $IMAGE_FRONTEND:$IMAGE_TAG \
            ./frontend

          docker push $IMAGE_FRONTEND:latest
          docker push $IMAGE_FRONTEND:$IMAGE_TAG

      - name: Build & push webserver
        if: needs.changes.outputs.webserver == 'true'
        run: |
          docker build -t $IMAGE_WEBSERVER:latest -t $IMAGE_WEBSERVER:$IMAGE_TAG ./backend/nginx
          docker push $IMAGE_WEBSERVER:latest
          docker push $IMAGE_WEBSERVER:$IMAGE_TAG

  deploy:
    runs-on: ubuntu-latest
    needs: [changes, build-push]
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/smart-store/"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          # Optional — set this secret to enable the extra public-domain
          # check at the end of the script; leave it unset to skip it.
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: PUBLIC_URL
          script: |
            set -e
            cd ~/smart-store

            echo ">>> Pulling changed images"
            if [ "${{ needs.changes.outputs.backend }}" = "true" ]; then
              docker pull ${{ secrets.DOCKERHUB_USERNAME }}/smart-store-backend:latest
            fi
            if [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
              docker pull ${{ secrets.DOCKERHUB_USERNAME }}/smart-store-frontend:latest
            fi
            if [ "${{ needs.changes.outputs.webserver }}" = "true" ]; then
              docker pull ${{ secrets.DOCKERHUB_USERNAME }}/smart-store-webserver:latest
            fi

            echo ">>> Restarting containers"
            docker compose down --remove-orphans || true
            docker compose up -d --remove-orphans

            if ! docker compose ps backend_service | grep -q "Up"; then
              echo "!!! backend_service failed to start"
              docker compose logs backend_service --tail=50
              exit 1
            fi

            # Migrations/cache don't run just because a new image was
            # pulled — this is the one step that actually applies a new
            # deploy's schema changes and clears any stale bootstrap cache
            # (bootstrap/cache is bind-mounted from the host in
            # docker-compose.yml, so a stale route/config cache would
            # otherwise survive indefinitely across redeploys).
            echo ">>> Running migrations and clearing cache"
            docker compose exec -T backend_service php artisan migrate --force
            docker compose exec -T backend_service php artisan optimize:clear
            docker compose exec -T backend_service php artisan optimize

            # Restart PHP-FPM workers so they pick up the fresh route/config
            # cache from bootstrap/cache (bind-mounted from the host). Without
            # this, long-lived FPM workers can serve stale in-process state
            # (or stale OPcache bytecode) from before optimize ran.
            echo ">>> Restarting PHP-FPM to load fresh cache"
            docker compose exec -T backend_service supervisorctl restart php-fpm
            sleep 3

            # Poll instead of a flat sleep — recreated containers can take
            # a variable amount of time to come up, and a fixed sleep is
            # either too short (flaky) or wastes time on a fast start.
            # GET /api/me with no token must come back 401 (route exists,
            # auth required); a 404 means the app itself doesn't have the
            # route (stale cache/code) even after optimize:clear above.
            echo ">>> Waiting for the app to respond on the host port"
            READY=""
            for i in $(seq 1 15); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:84/api/me || echo "000")
              if [ "$CODE" != "000" ]; then
                READY=1
                break
              fi
              sleep 2
            done
            if [ -z "$READY" ]; then
              echo "!!! App never responded on http://localhost:84 after 30s"
              docker compose logs backend_service --tail=50
              docker compose logs webserver --tail=50
              exit 1
            fi
            if [ "$CODE" = "404" ]; then
              echo "!!! /api/me returned 404 — dumping diagnostics"
              docker compose exec -T backend_service php artisan route:list --path=api/me 2>&1 || true
              docker compose logs backend_service --tail=30
              docker compose logs webserver --tail=20
              exit 1
            fi
            echo ">>> App responding correctly (status $CODE)"

            # This check is best-effort and non-blocking: if it fails while
            # the host-port check above passed, the deploy itself is fine —
            # the problem is in whatever sits in front of that public URL
            # (DNS, CDN cache, reverse proxy), which this pipeline doesn't
            # manage and shouldn't fail the deploy over.
            if [ -n "$PUBLIC_URL" ]; then
              PUBLIC_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL/api/me" || echo "000")
              if [ "$PUBLIC_CODE" = "404" ]; then
                echo "!!! WARNING: $PUBLIC_URL/api/me returned 404 even though localhost:84 is fine."
                echo "!!! Check whatever sits in front of that domain (CDN/reverse-proxy cache, DNS) — not this deploy."
              else
                echo ">>> Public URL check passed (status $PUBLIC_CODE)"
              fi
            fi

            echo ">>> Cleaning up dangling images"
            docker image prune -f

            echo ">>> Deploy complete"
